[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clarif-eye"
version = "0.1.0"
description = "A cloud vision assistant that turns photos into spoken descriptions for visually impaired users."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "langgraph>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages]
find = {where = ["src"]}

[tool.setuptools.package-data]
clarif_eye = ["config/models.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

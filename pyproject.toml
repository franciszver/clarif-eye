[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clarif-eye"
version = "0.1.0"
description = "A cloud vision assistant that turns photos into spoken descriptions for visually impaired users."
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "langgraph>=1.2", "ddgs>=9.0", "beautifulsoup4>=4.12", "edge-tts>=6.1", "gTTS>=2.5", "gradio>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages]
find = {where = ["src"]}

[tool.setuptools.package-data]
clarif_eye = ["config/models.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Start narrow: undefined names/imports (F) and unused imports/variables
# (F401/F841) are real bugs. E/W (pycodestyle) and the rest of the default
# rule set are left off for now; the codebase was never formatted against
# them and enabling them would need a mass reformat rather than a
# defensible gate. See CHECK F in the CI proof for what else was tried and
# dropped, and why.
select = ["F"]
